<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Fátima 💖</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ffd1dc, #ff8fab, #ff5d8f);
            text-align: center;
        }

        .container {
            padding: 60px 20px;
        }

        h1 {
            color: #a0003d;
            font-size: 48px;
            margin-bottom: 20px;
        }

        p {
            color: #7a0030;
            font-size: 22px;
            max-width: 600px;
            margin: 0 auto 30px auto;
        }

        .gallery {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .gallery img {
            width: 250px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.25);
            transition: transform 0.3s;
        }

        .gallery img:hover {
            transform: scale(1.05);
        }

        .heart {
            font-size: 40px;
            margin-top: 30px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Te amo, Camaroncita 💖</h1>

        <p>
            Eres muy especial para mí.  
            Tuve que aprender compu por ti jeje 💗
        </p>

        <div class="gallery">
            <!-- AQUÍ VAN TUS FOTOS -->
            <img src="jkjd.jpg" alt="te amo">
            <img src="wjd.jpg" alt="cada día más">
            <img src="jeje.jpg" alt="amorcito">
        </div>

        <div class="heart">❤️💗❤️</div>

        <p>
            Gracias por estar en mi vida y hacerla más hermosa.
        </p>
    </div>
</body>
</html>
